[package]
name = "xedit-cli"
version = "0.1.0"
description = "Command-line interface to xEdit"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xedit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
xedit-session = { path = "../xedit-session" }
