[package]
name = "xedit-cli"
version = "0.1.0"
description = "Command-line interface to xEdit"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xedit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mimalloc = "0.1"
serde_json = "1.0.151"
xedit-session = { path = "../xedit-session" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
