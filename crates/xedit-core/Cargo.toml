[package]
name = "xedit-core"
version = "0.1.0"
description = "Element tree, definition model, records, groups, files and FormIDs of xEdit"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.2"
rayon = "1.12.0"
thiserror = "2.0.21"
xedit-io = { path = "../xedit-io" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
