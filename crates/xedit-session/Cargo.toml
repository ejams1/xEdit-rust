[package]
name = "xedit-session"
version = "0.1.0"
description = "Session state and the command registry behind every xEdit operation"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xedit-assets = { path = "../xedit-assets" }
xedit-core = { path = "../xedit-core" }
xedit-defs = { path = "../xedit-defs" }
xedit-io = { path = "../xedit-io" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dump"
harness = false
