[package]
name = "xedit-session"
version = "0.1.0"
description = "Session state and the command registry behind every xEdit operation"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xedit-analysis = { path = "../xedit-analysis" }
xedit-assets = { path = "../xedit-assets" }
xedit-core = { path = "../xedit-core" }
xedit-defs = { path = "../xedit-defs" }
xedit-io = { path = "../xedit-io" }
xedit-loadorder = { path = "../xedit-loadorder" }
xedit-script = { path = "../xedit-script" }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dump"
harness = false
