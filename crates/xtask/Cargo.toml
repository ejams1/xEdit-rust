[package]
name = "xtask"
version = "0.1.0"
description = "Repository maintenance tasks: header check, upstream map, coverage ledger"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5.0"
xedit-assets = { path = "../xedit-assets" }
xedit-io = { path = "../xedit-io" }
zstd = "0.14.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
