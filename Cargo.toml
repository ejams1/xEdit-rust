[workspace]
resolver = "3"
members = ["crates/*"]

# Every crate inherits these with `license.workspace = true` and so on.
[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/ejams1/xEdit-rust"

# Debug information is the largest per-crate cost of a debug or test build,
# and the parity work rarely needs more than line tables for a backtrace.
# Dependencies get none: their frames are not what a failing port test reads.
[workspace.dependencies]
# Decision 1 of `docs/PLAN.md`: the GUI toolkit. Use the operating-system
# font provider so the executable does not bundle epaint's separately
# licensed default fonts.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
