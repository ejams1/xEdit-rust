[workspace]
resolver = "3"
members = ["crates/*"]

# Every crate inherits these with `license.workspace = true` and so on.
[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/ejams1/xEdit-rust"

# Debug information is the largest per-crate cost of a debug or test build,
# and the parity work rarely needs more than line tables for a backtrace.
# Dependencies get none: their frames are not what a failing port test reads.
[workspace.dependencies]
# Decision 1 of `docs/PLAN.md`: the GUI toolkit. An egui application with a
# custom virtualised tree and grid; MIT OR Apache-2.0, so the licence gate
# stays green. The `default_fonts` feature is off: egui's bundled fonts are
# OFL-1.1 and Ubuntu-font-1.0, which the licence gate does not allow, and
# the GUI loads the fonts of the settings file itself (the records and the
# messages fonts), so it needs no bundled fallback.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0

# The release profile of the shipped binaries. `lto = "fat"` and one codegen
# unit let the optimizer see the whole program, which is what the phase 8
# gate measures against the Delphi build.
#
# `panic` stays "unwind" on purpose: a worker panic is turned into a
# DfError with catch_unwind in `xedit-assets/src/sniff/main_form.rs:545`,
# `xedit-cli/src/main.rs:4067` uses resume_unwind, and rayon propagates
# worker panics by unwinding. A profile that aborts would turn those
# into a process kill.
#
# No `target-cpu` anywhere: the binaries ship to users and the output must
# not depend on the CPU. The runtime dispatch in `xedit-io`'s `simd.rs` is
# the route to the vector kernels.
[profile.release]
lto = "fat"
codegen-units = 1

# The release profile with line tables, for a profiler that needs the
# frames of the port's own code.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

# The release profile for the parity harness, which links the whole
# program anyway but does not need the optimizer's last percent: thin LTO
# and more codegen units keep the dev loop short.
[profile.harness]
inherits = "release"
lto = "thin"
codegen-units = 16
