# The audit of the covered `gui.*` bindings of `coverage/ledger.toml`.
#
# One row per covered binding: the DFM control upstream renders, the
# Rust module of `crates/xedit-gui/src` that draws it, the name the
# port gives that control and the session command the control calls.
# `cargo xtask check` verifies the table against the ledger and against
# the sources of the port.
#
# `reach` is one of:
#   reachable    - the control of the port calls the command;
#   reimplemented - the port does the work by another route, so the
#                  command of the ledger is not called from the control;
#   unreachable  - the port renders no control for the binding.
# The rows that are not `reachable` name the reason, and the ledger
# entry repeats it.

[gui."BSArch/frmArchiveInfo.dfm:mniSaveAs:OnClick"]
control = "mniSaveAs"
command = "archive.list"
reach = "unreachable"
reason = "The port has no BSArch window: upstream-map.toml keeps the BSArch forms pending (the GUI itself is not ported), so no control of the port reaches this command."

