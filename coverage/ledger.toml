source = "Core/wbInterface.pas"
note = "tool.run mode=sortandcleanmasters <module> ..., the SortMasters/CleanMasters loop of the auto mode dispatch. The modules are the ones named (xeModulesToUse); each must be editable. UPSTREAM-QUIRK: the release refuses the switch -sortandcleanmasters (the mode selection of _DoInit compares the whole name with sortandclean), so only -sortandclean or the ...SortAndCleanMasters.exe name selects it; the port's legacy command line accepts both."

