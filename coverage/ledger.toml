note = "Owned by issue #81 (form scripts): JvInterpreterRunUnit compiles a unit's source in a new form interpreter and runs its main block; the headless VCL model refuses it with [EVclUnavailable] JvInterpreterRunUnit is not available without a GUI (script_vcl/interactive.rs), so the ledger's earlier covered was a refusal, not the operation (parity #41 audit). No script of the corpus calls it."

