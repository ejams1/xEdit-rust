[tool_mode.tmCheckForErrors]
status = "covered"
command = "files.check"
source = "Core/wbInterface.pas"
note = "xedit check, which loads as the mode does (commands::set_check_on_load) and checks the last file of the load order with `check --last`; tool.run mode=checkforerrors runs it and returns the exit code (the count, at most 127)."

[tool_mode.tmCheckForITM]
status = "covered"
command = "files.clean"
source = "Core/wbInterface.pas"
note = "tool.run mode=checkforitm counts the records identical to their master of the last loaded plugin (files.clean with dry_run, the Counting/Counted wording of the mode) and exits with the count, at most 127; nothing is saved."

[tool_mode.tmDump]
