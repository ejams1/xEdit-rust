command = "script.run"
source = "IwbContainer_ContainerStates"
note = "Implemented: the set as a bit mask, the references adding `csRefsBuild`: 1031 (`csInit|csInitOnce|csInitDone|csConstructionCompleted`) for a file and a group; for a main record or a subrecord built and held (a script references one of its elements: `cntElementRefs`), 1026 (`csInitOnce|csConstructionCompleted`) once built and reset (an `EDID`, which the record's own `Init` reads; `DATA` after a read), 1024 never built (a record `RecordByIndex` reached alone); a value (the record header) 1031 once read, as the script's reference keeps it (`eExternalRefs`). `el-states.pas` compares 23 such lines (fix-numerics, issue #67). The resets follow the releases (fix-numerics-2, issue #69): a value read and let go while another member holds its record is reset alone, 1026 (`TwbContainer._Release`, `eExternalRefs < 1`); the release of the last reference into a main record resets the record, whose members start unread (1024; the `EDID` 1026), counted per record from the script's element values (`MainRecordImpl::acquire_member_ref`); `el-states.pas` compares 15 more such lines."

