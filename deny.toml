# cargo-deny configuration. Run `cargo deny check licenses`.
#
# The project is MPL-2.0. Only licenses that leave the distributed binaries
# under MPL-2.0 are allowed. GPL, LGPL and AGPL dependencies are rejected
# because they are absent from this list.
[licenses]
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
