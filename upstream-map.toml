# Upstream xEdit units and the state of their Rust port.
# Maintained with `cargo xtask sync`. Edit statuses by hand.

[upstream]
repository = "https://github.com/TES5Edit/TES5Edit"
tag = "xedit-4.1.5q"
commit = "fd1e36020b2b5b6217e553dc0038983146a2e2dd"

[units."BSArch.dpr"]
status = "ported"
rust = "crates/bsarch/src/main.rs"
note = "The console tool: info with -list and -dump, pack and unpack, with the arguments and the text of BSArch.exe (the usage is the oracle's, byte for byte). The pack options -tes3 to -sf1dds, -z, -split, -f, -share, -mt, -af and -ff are accepted, the texture formats (-fo4dds, -sf1dds) included. Extension: -threads:N."

