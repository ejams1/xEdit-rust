[units."xEdit/JvI/xejviScriptAdapterMiscRegEx.pas"]
status = "ported"
rust = "crates/xedit-session/src/script_misc_regex.rs"
note = '''Phase 6 (scripting), step 7 (landed 2026-10-10): all 48 ledger entries are covered by script.run. crates/xedit-session/src/script_misc_regex.rs is TPerlRegEx over the `regex` crate: the class, the 10 constants, the 28 gets (Compile/Study/Compiled/Studied, Match/MatchAgain/FoundMatch, the group accessors, MatchedOffset/Length/Text, Subject/SubjectLeft/SubjectRight, RegEx/Replacement/Start/Stop/Options, EscapeRegExChars, StoreGroups, ComputeReplacement, Replace/ReplaceAll, Split/SplitCapture) and the 6 sets and 3 igets. The upstream call shape and the RTL's error texts (ERegularExpressionError) are kept. UPSTREAM-QUIRK documented in the module: `regex` has no lookaround, no in-pattern backreferences and no possessive quantifiers; `\d`/`\w`/`\s` are Unicode where PCRE was ASCII; `preNotBOL`/`preNotEOL` have no equivalent and `preNoAutoCapture` none (empty matches are skipped for `preNotEmpty`, and `preAnchored` is emulated by requiring the match at the search position); offsets count characters where upstream counts UTF-8 bytes (equal for ASCII subjects).  The parity backlog's #29 (2026-10-15) replaced the `regex`-crate stand-in with the port's own PCRE engine, crate files `crates/xedit-core/src/pcre.rs` and `crates/xedit-core/src/perl_regex.rs`: `crates/xedit-core/src/pcre.rs` (pattern parser and backtracking VM in UTF-8 mode with `PCRE_NOTBOL`/`NOTEOL`/`NOTEMPTY`, ASCII `\d`/`\w`/`\s`, Latin-1 case folding, lookaround, atomic groups, possessive quantifiers and PCRE's compile errors with their offsets) and `crates/xedit-core/src/perl_regex.rs` (the `TPerlRegEx` class with the RTL's 1-based character offsets, the `Start`/`Stop` window, `Match`/`MatchAgain`'s past-the-stop rule, `ComputeReplacement`, `Split`/`SplitCapture` and `NamedGroup`'s `PCRE_ERROR_NOSUBSTRING` of -7). The script adapter is the registration and the error class on top of it; Sniff's `perl_regex.rs` and the filter's `CheckValueRegex` run the same class. Evidence: `cargo xtask parity script --script "Regex probe" --phase run` (the probe in `crates/xtask/oracle/scripts/probes`, the oracle's 222 lines equal on the port). `preNotBOL`/`preNotEOL`/`preNotEmpty` cannot be probed: upstream registers no `State` property.The two commented-out `AddHandler` lines upstream stay unregistered.'''

