note = "Phase 6 step 8, landed 2026-10-10: the whole unit (`crates/xedit-session/src/script_rtl/math.rs`), 67 live registrations -- the eleven constants (`PI`, `Infinity`/`NegInfinity`, `Max*`/`Min*` with the release's values -- parity #39 probed every one against the oracle: `MinSingle` = 1.1754943508222875e-38 (the smallest normal; the old `Math.pas` 1.5e-45 is not the build's), `MinDouble` = `MinExtended` = 2.2250738585072014e-308, `MaxComp`/`MinComp` = ±2^63, and the `NaN` constant is the RTL's `0xFFF8...` real indefinite, not `f64::NAN`) and the 56 functions, with Delphi's formula semantics where they show (`Hypot`'s scaling, `Power` through `IntPower` for an integer exponent, `Log10`/`Log2`/`LogN` as `Ln` quotients, the degree helpers) and `nif_math` for the FPU-accurate transcendentals. Two upstream quirks are kept: `ArcCotH` binds `ArcCot`'s handler, and `MaxExtended`'s registration is commented out (`excluded` in the ledger). `ClearExceptions` does nothing (no FPU exception state in the port); `RandG` is the polar method over `System.Random` with the cached second value. The unit is tracked because `cargo xtask sync` scans the JVCL interpreter units `xejviScriptAdapter.pas` registers in its `Init` (`xEdit/JvI/xejviScriptAdapter.pas:356-371`) under `External/jvcl/jvcl/run/`; the submodule is outside the map's unit directories, so the sync reads the files by name (`crates/xtask/src/main.rs`: JVCL_UNITS)."

