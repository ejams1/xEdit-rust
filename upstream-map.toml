[units."xEdit/JvI/xejviScriptAdapterDF.pas"]
status = "ported"
rust = "crates/xedit-session/src/script_df.rs"
note = "Phase 6 (scripting), step 6, landed 2026-10-10 (branch p6-step6): the whole unit over the phase 5 data format port (`xedit-assets`), 173 of its 174 ledger entries bound to `crates/xedit-session/src/script_df.rs` (41 classes of the TdfDef/TdfElement hierarchies, the 25 dft*/nfo*/nf* constants, dfFloatToStr/dfStrToFloat/dfCalcHash, 87 gets, 8 sets, 7 igets, 2 isets, 1 idget); `TdfDef.Create` stays excluded (commented out upstream at line 767). A DF object is a `DfElement`/`DfDefObject` wrapper over a document (`DfDoc`, the phase 5 `Tree` plus its root), with the script class derived from the port's element class and definition kind; `LoadFromResource` binds `dfResourceGetDataCallback` to `xedit_core::container_handler::open_resource_data`, and the `TList`/`TStrings` a `GetAssetsList` or a `...ByType` call fills go through `script::ScriptLists` (the JVCL `Classes` unit, step 8). What differs from the GUI's Delphi model is listed in the module docs of script_df.rs (O2V(nil) as Unassigned, `Free` of the root releasing the document, the error class name of the run log)."

[units."xEdit/JvI/xejviScriptAdapterElement.pas"]
status = "ported"
