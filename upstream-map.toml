note = "The container handler: AddFolder, AddBSA, ContainerExists, ContainerList, OpenResource, OpenResourceData, the resource listings (ContainerResourceList, ContainerResourceDict, ResourceExists, ResourceCount, ResourceCopy) and the file and folder hash tables (BuildCache, ResolveFileHash, ResolveFolderHash, wired into wbFileHashCallback and wbFolderHashCallback behind wbLoaderDone). DEVIATION: BuildCache reads <game>.HashSeed.txt but does not write the .txt2 file beside the program. The unit has no texture helpers in this tag."

[units."Core/wbBSArchive.pas"]
status = "ported"
rust = "crates/xedit-io/src/archive"
note = "TwbAsset, TwbBSArchive (reading and writing every BSA, Morrowind and general BA2 version, the DX10 texture archives included: the DDS branches of Pack and Unpack and of TwbSplitPacker.LoadFile are archive/texture.rs; listing, Info and Warnings), TwbSplitPacker and TwbMultiSourcePacker (the steps of Process in upstream's single-thread order with the reading and compressing on all CPUs) are ported; the output equals BSArch.exe -mt:no for every thread count (cargo xtask parity bsarch, texture archives included). Not ported: the stream-to-stream overloads of wbCompression have no caller. DEVIATION: a texture whose data ends before its last mipmap is cut where the data ends in the route without a packer too (upstream reads past the buffer there)."

