d and ConflictThisForMainRecord for every record, InheritStateFromChildren for the files) and records.compare (SetActiveRecord with InitConflictStatus and mniViewHideNoConflict) run it (crates/xedit-session/src/conflicts.rs), and a session builds its definitions with the settings of xeInit (wbSimpleRecords, wbHideUnused, wbCreateContainedIn) and sets wbFlagsAsArray as FormCreate does. Phase 4 step 6: the mod groups of NodeDatasForMainRecord (crates/xedit-session/src/modgroups.rs behind the ModGroupFilter hook), mniViewModGroupsReloadClick (modgroups.select, and the reload that ends the other mod group commands), mniNavCreateModGroupClick (modgroups.create), mniNavEditModGroupClick (modgroups.edit), mniNavDeleteModGroupsClick (modgroups.delete), mniNavUpdateCRCModGroupsClick (modgroups.update_crcs), LoadModGroupsSelection and SaveModGroupsSelection (the [ModGroups] Selection of the settings file, xeSettingsFileName of xeInit), mniModGroupsAbleClick (the mod group parameters of conflicts.list and records.compare). Pending: IsHidden, the compare-to load (IsCompareToSame), CompareSelected (ComparingSiblings) and ConflictAllForElements as commands. Phase 4 step 5: the navigation tree with the filter for cleaning (ReInitTree, vstNavInitNode, vstNavInitChildren, vstNavCompareNodes for the default sort column, InheritStateFromChildren and mniNavFilterApplyClick with the conflict options only; crates/xedit-analysis/src/filter.rs), mniNavRemoveIdenticalToMasterClick, mniNavUndeleteAndDisableReferencesClick, mniNavCleanupInjectedClick and the quick clean passes of tmrGeneratorTimer (crates/xedit-analysis/src/cleaning.rs), run by files.clean and records.cleanup_injected (crates/xedit-session/src/clean.rs); mniNavCleaningObsoleteClick is a message (CLEANING_OBSOLETE). The settings xeInit gives the quick clean modes (wbSimpleRecords off, wbFillPNAM, wbFillINOM and wbFillINOA off, wbAllowInternalEdit, wbRemoveOffsetData) are applied by commands::set_quick_clean_on_load. Phase 4 step 4: the rest of the filter options (mniNavFilterApplyClick with TfrmFilterOptions: the conflict sets, the inject, not-reachable and references-injected states, the editor ID, name, element value with CheckValueRegex, base editor ID, base name, scaled actors, signatures and base signatures with the derived reference signatures, the persistence options with IsUnnecessaryPersistent, IsMasterTemporary and IsPositionChanged, the deleted and visible-when-distant flags, the visible-when-distant and precombined meshes, the flattening of blocks and cell children, AssignPersWrldChild, the top level groups and BuildAllRef; crates/xedit-analysis/src/filter.rs), mniNavFilterConflictsClick (the conflicts preset), mniNavFilterForOnlyOneClick (FilterOnlyOne) and mniNavFilterRemoveClick (filter.remove), mniNavBuildReachableClick (refs.build_reachable) with TwbFile.BuildReachable, Reached and ResetReachable (crates/xedit-core/src/implementation/reachable.rs), run by filter.apply (crates/xedit-session/src/filter.rs). The view filter of the view tab (ApplyViewFilter and IsViewNodeFiltered) is the view_filter_name, view_filter_value, view_filter_or and keep_children, keep_siblings and keep_parents_siblings parameters of records.compare, and the referenced-by filter (ApplyReferencedByFilter) is the filter_name, filter_signature, filter_file and filter_or parameters of refs.get. Pending: FilterScripted (the Filter function of a script, phase 6), IsHidden and the compare-to load (no state in the port), the file name filter of the navigation tree (edFileNameFilter and cbRegExFilter), the Build Reference Info file selection of mniNavBuildRefClick (refs.build takes one file) and the * Selected file selection dialog (the files parameter, whose dialog is not ported). Pending: wbAllowMakePartial (MakePartialForm), the LOOT dirty information list (LOOTPluginInfos, mniNavLOManagersDirtyInfoClick), the tool modes and switches (step 9). Phase 4 step 7 (crates/xedit-session/src/localization.rs): mniNavLocalizationSwitchClick with GatherLStrings is localization.localize and localization.delocalize, mniMainLocalizationLanguageClick is localization.language (refused while tables are unsaved, unless discard), the language list of pmuMainPopup is localization.languages, mniMainLocalizationEditorClick and the lstring editor of vstViewEditing are the localization.* editor commands, and SaveChanged writes the modified tables of a plugin with it (files.save). The `if wbTranslationMode then Exit` of the structure handlers (and the menu items pmuNavPopup hides in the translate mode) are refuse_in_translate_mode of records.copy, records.delete, elements.add, elements.remove, formids.change, formids.renumber, masters.add, masters.sort, masters.clean, files.clean and records.cleanup_injected; elements.set edits only the elements the translate mode shows (not cpIgnore). Phase 4 step 3: CheckForErrorsLinear, CheckForErrors and mniNavCheckForErrorsClick are ported in crates/xedit-analysis/src/check.rs (the records checked on worker threads in batches, the counting of LastRecord, ErrorsCount and CheckedCount kept), run by files.check (crates/xedit-session/src/check.rs) with the settings xeInit gives tmCheckForErrors (commands::set_check_on_load: wbAllowInternalEdit and wbBuildRefs off); the tool mode's selection of the last file is files.check last. Pending: the tool mode itself (step 9). Phase 4 step 8: mniNavCreateMergedPatchClick (UpdateOrderedTargetList, UpdateTargetList, ListsEqual, CheckGroup, BuildList; the TStringList sort and Find with AnsiCompareText) is ported in crates/xedit-analysis/src/merged_patch.rs and run by patch.merged (crates/xedit-session/src/patch.rs); AddNewFile, AddNewFileName, GetSanitizedFilename and IsValidWindowsFileName are files.new (crates/xedit-session/src/new_file.rs, also the start of mniCreateNewFileClick, with the module templates of AddNewFileWithDialog as its template parameter). Phase 4 step 9: the auto mode dispatch of tmrGeneratorTimer (SetAllToMaster, RestorePluginsFromMaster, UpdateAllOnam, the sort and clean masters loop and the check modes with the Counting/Counted wording) and GenerateSEQFileForFile are tool.run (crates/xedit-session/src/tool_modes.rs), and the GUI's own modes are driven by the harness (parity tool-modes: -setesm, -clearesm, -masterupdate, -masterrestore, -onamupdate, -sortandcleanmasters, -generateseq, -checkforitm, -checkfordr). UPSTREAM-QUIRK: the dispatch has no branch for tmESMify, so -setesm changes nothing in 4.1.5q; the port follows it. The check modes count (AutoModeCheckForITM/DR) and never save, and their exit code is the count, at most 127 (CheckResult) - tool.run returns it as exit_code. Pending: the merge after an exception in a record keeps the lists of that record for the next one (TargetLists are not freed), not reproduced. The walk of `BuildReachable` drains the collector only in the call that owns it (a call whose `_Collector` is assigned queues into the owner's list and its own `Collector` stays empty upstream): walking the shared queue again from every record it drained ran the bodies in another order and, through the material and impact records of Skyrim, ran the walk of the five Skyrim SE masters out of stack and through the square of the queue (7.4 hours for the walk; 41.5 s with the drain in the owning call, and the not-reachable configurations equal). Step 4 of phase 6 (host and run loop), landed 2026-10-10: DoRunScript (the -script: resolution against wbScriptsPath, the selection of every root node), ApplyScript (Initialize, the ScriptProcessElements/ScriptProcessSignatures filters with FunctionIsEmpty, Process per selected element with the Script terminated itself, Result=<n> of a non-zero result, Finalize, the Exception in unit <u> line <n>: [<class>] <message> and Aborted: Applying script "<name>" of a failure, and the Mode: Silent of the script's first Mode: line), ApplyScriptToSelection (the walk from vstNav.GetLast back to the selected node, so a file's records run in the reverse of their order and the file node last), ScriptCanProcessElement and ScriptProcessSingleElement (the wbProgressLock around a Process call), the element children of vstNavInitNode/vstNavInitChildren (a main record's node container is its ChildGroup) and wbFormatElapsedTime are ported in crates/xedit-session/src/script.rs as script.run, with the navigation tree walk as the ScriptSelection seam the adapter steps bind; the tmScript tool mode and the -script: switch run the same path (crates/xedit-session/src/tool_modes.rs), and the closing SaveChanged of an auto mode saves the plugins a run changed. TLoaderThread.Execute's resources (the archives of the game inis and of each module, wbLoadBSAs and its Skipped lines, the data folder, EnsureCache) and the wbLoaderDone of WMUserLoaderDone are crates/xedit-session/src/resources.rs, which every session runs (issue #32)."""
