note = "Decompression and compression of every type: zlib (libdeflate level 12 up to 8 MiB, zlib's compress2 level 9 beyond), LZ4 (LZ4_compress_HC level 12) and LZ4F (LZ4F_compressFrame, independent 4 MB blocks), from the C libraries upstream links (lz4 1.10 gives the bytes of the oracle). The stream-to-stream overloads (ZCompressStream, LZ4FCompressStream, TLZ4.Stream_Decode) have no caller in the port and are pending."

