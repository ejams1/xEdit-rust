[units."xEdit/xeMainForm.pas"]
status = "pending"
rust = "crates/xedit-session/src/save.rs"
note = "SaveChanged is ported as files.save (one file per call, atomic rename instead of the queued rename). mniNavAddClick is elements.add, mniNavRemoveClick is records.delete and elements.remove, mniNavCopyIntoClick (copy as override, as new record, deep copy) is records.copy, and mniNavAddMastersClick, mniNavSortMastersClick and mniNavCleanMastersClick are masters.add, masters.sort and masters.clean (crates/xedit-session/src/edit.rs and masters.rs), the dialogs as parameters; the copy with overwriting, as a spawn rate override and as a wrapper are not ported. mniNavChangeFormIDClick, mniNavRenumberFormIDsFromClick (with Compact and Inject) and ShowChangeReferencedBy are ported as formids.change and formids.renumber (crates/xedit-session/src/formids.rs), the dialogs as parameters. mniNavGenerateLODClick and DoGenerateLOD (the tmLODgen mode: the archives of the game ini and the plugins loaded as TLoaderThread does, no internal edits, the shorter names) are ported as lodgen.generate (crates/xedit-session/src/lodgen.rs); the LODGen form itself is xeLODGenForm.pas. The form itself is pending. The GUI's wbDisplayShorterNames applies to the messages of files.save, as the oracle reports them. Phase 4 step 2: the conflict code (ConflictLevelForMainRecord, ConflictLevelForContainer, ConflictLevelForNodeDatas, ConflictLevelForChildNodeDatas, InitChildren with the alignment of TDiff from External/Diff/Diff.pas in crates/xedit-analysis/src/diff.rs, InitNodes, InitConflictStatus, NodeDatasForMainRecord, NodeDatasForContainer, GetMasterAndLeafs, Displayable, the texts of vstViewGetText) is ported in crates/xedit-analysis/src/conflict.rs, out of the form; conflicts.list (ConflictAllForMainRecord and ConflictThisForMainRecord for every record, InheritStateFromChildren for the files) and records.compare (SetActiveRecord with InitConflictStatus and mniViewHideNoConflict) run it (crates/xedit-session/src/conflicts.rs), and a session builds its definitions with the settings of xeInit (wbSimpleRecords, wbHideUnused, wbCreateContainedIn) and sets wbFlagsAsArray as FormCreate does. Pending: the mod groups of NodeDatasForMainRecord (the ModGroupFilter hook, phase 4 step 6), IsHidden, the compare-to load (IsCompareToSame), CompareSelected (ComparingSiblings) and ConflictAllForElements as commands. Phase 4 step 2: the conflict code (ConflictLevelForMainRecord, ConflictLevelForContainer, ConflictLevelForNodeDatas, ConflictLevelForChildNodeDatas, InitChildren with the alignment of TDiff from External/Diff/Diff.pas in crates/xedit-analysis/src/diff.rs, InitNodes, InitConflictStatus, NodeDatasForMainRecord, NodeDatasForContainer, GetMasterAndLeafs, Displayable, the texts of vstViewGetText) is ported in crates/xedit-analysis/src/conflict.rs, out of the form; conflicts.list (ConflictAllForMainRecord and ConflictThisForMainRecord for every record, InheritStateFromChildren for the files) and records.compare (SetActiveRecord with InitConflictStatus and mniViewHideNoConflict) run it (crates/xedit-session/src/conflicts.rs), and a session builds its definitions with the settings of xeInit (wbSimpleRecords, wbHideUnused, wbCreateContainedIn) and sets wbFlagsAsArray as FormCreate does. Pending: the mod groups of NodeDatasForMainRecord (the ModGroupFilter hook, phase 4 step 6), IsHidden, the compare-to load (IsCompareToSame), CompareSelected (ComparingSiblings) and ConflictAllForElements as commands. Phase 4 step 5: the navigation tree with the filter for cleaning (ReInitTree, vstNavInitNode, vstNavInitChildren, vstNavCompareNodes for the default sort column, InheritStateFromChildren and mniNavFilterApplyClick with the conflict options only; crates/xedit-analysis/src/filter.rs), mniNavRemoveIdenticalToMasterClick, mniNavUndeleteAndDisableReferencesClick, mniNavCleanupInjectedClick and the quick clean passes of tmrGeneratorTimer (crates/xedit-analysis/src/cleaning.rs), run by files.clean and records.cleanup_injected (crates/xedit-session/src/clean.rs); mniNavCleaningObsoleteClick is a message (CLEANING_OBSOLETE). The settings xeInit gives the quick clean modes (wbSimpleRecords off, wbFillPNAM, wbFillINOM and wbFillINOA off, wbAllowInternalEdit, wbRemoveOffsetData) are applied by commands::set_quick_clean_on_load. Pending: the other filter options (step 4), wbAllowMakePartial (MakePartialForm), the LOOT dirty information list (LOOTPluginInfos, mniNavLOManagersDirtyInfoClick), the tool modes and switches (step 9)."

