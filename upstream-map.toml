[units."Core/wbImplementation.pas"]
status = "pending"
rust = "crates/xedit-core/src/implementation"
note = "The structure scan of a file, the records, subrecords, values, unions, the record header and the contained-in element are ported for reading. The save path (implementation/write.rs: the modified states, PrepareSave with the header edits, WriteToStream, the CRC32) and the editing path (implementation/edit.rs: the storage of a changed element, RequestStorageChange, UpdateStorageFromElements, the update counter and its notifications, SetEditValue, SetNativeValue, SetToDefault, the elements made from their definitions, Add of a record member, Remove, the required members added on init) are ported. The master management (implementation/masters.rs: AddMasters, AddMastersIfMissing, AddMasterIfMissing, SortMasters, CleanMasters, HasMaster, GetIsEditable, the MastersUpdated and FindUsedMasters chains through files, groups, records, subrecords, unions and values, SortRecords again after a change) is ported, without the two views of the masters during an update (fsMastersUpdating, eMastersGeneration) and the INFO sort of a topic group after it. The FormID path (implementation/form_ids.rs: SetLoadOrderFormID, UpdateInteriorCellGroup, SetGroupLabel, GetIsInjected, the registration part of AddMainRecord with the light, medium and update checks, flRemoveKeysFromIndices), the module flags of TwbFile (implementation/file_flags.rs: GetIsNotPlugin, GetIs and SetIs of the ESM, light, medium, update, blueprint and localized flags) and BuildRef and CompareExchangeFormID of the elements (implementation/refs.rs, with ReferenceScan in place of the referenced-by lists) are ported. The add, remove and copy path (implementation/assign.rs: Assign and CanAssign of TwbElement and TwbContainer with IsElementEditable, IsElementRemovable, GetIsRemovable, ContainsReflection and ContainsUnmappedFormID, and the overrides of the subrecords, values and main records next to them; implementation/add.rs: TwbMainRecord.Create with a signature, the TwbGroupRecord.Create overloads, Add of the file, the groups and the main records with their child groups, SetEditorID, SetGridCell, SetPosition, TwbMainRecord.Remove with RemoveMainRecord, YouGotAMaster and YouAreTheMaster; implementation/copy.rs: CopyInto, wbCopyElementToFile, wbCopyElementToRecord, AddIfMissing of the file, the groups and the main records, ReportRequiredMasters, AddRequiredMasters; implementation/new_form_id.rs: NewFormID, GetNextObjectID, SetNextObjectID, GetHighObjectID) is ported, without IwbMultipleElements, template elements, aligned arrays, wbCanOverwrite (aAllowOverwrite with a deep copy), MakePartialForm, UpdateCellChildGroup, the BuildRef of the records an edit makes and the GroupToSkip and RecordToSkip lists. The scan of TwbFile.Scan and TwbGroupRecord.ScanData runs the large groups on worker threads (implementation/scan.rs) and replays AddMainRecord in file order; csInit/csInitializing of DoInit wait for another thread's init (threads.rs, not in upstream, which builds on one thread). Pending: the sort of a sorted array value inside a subrecord (srsSorted, arrSorted) and the sort of an array after CompareExchangeFormID, flags as array elements, CollapseStorage, the reference index (mrReferencedBy, BuildOrLoadRef and its cache), the identity FormID of a TES3 record, and the string tables of a localized file for writing. Phase 3 step 6 (from the oracle's own saves): the sort of a sorted subrecord array (arcSorted and arcSortInvalid of TwbSubRecordArray, CompareSortKeys), the sort keys of TwbContainer, TwbSubRecord and TwbSubRecordStruct, GetGroupLabel, the search of GetChildGroup (with the quest children group), ChildrenOf of an exterior block, SetIsPersistent and SetIsVisibleWhenDistant with CheckChildOfCell and UpdateCellChildGroup, fsIsOfficial of the official modules (Starfield does not edit them), GetShortNameInternal under wbDisplayShorterNames, and the record count without a skipped duplicate record."

[units."Core/wbInterface.pas"]
status = "pending"
rust = "crates/xedit-core/src/interface"
note = "The definition classes are ported by hand, with FromEditValue, FromNativeValue and SetToDefault for every value definition and formater. MastersUpdated and FindUsedMasters of the definitions and formaters (TwbIntegerDef, TwbFormIDDefFormater, TwbIntegerDefFormaterUnion, TwbStringMgefCodeDef), FixupFormID and TwbSlotCounts.Create are ported (form_id.rs). The builder functions are generated into builders.rs by cargo xtask port-defs emit, with their constructors in constructors.rs. CompareExchangeFormID is ported for TwbIntegerDef, TwbFormIDDefFormater and TwbIntegerDefFormaterUnion, and the flag setters of TwbMainRecordStructFlags with the mutual exclusion of the light, medium and update flags. Assign and CanAssign of every definition and formater are ported (def.rs and the files of the classes). The threadvars _InternalEditCount and _BlockInternalEdit are thread locals (globals.rs). Pending: SetLinksTo, PrepareSave of the definitions, and the rest of the unit."

