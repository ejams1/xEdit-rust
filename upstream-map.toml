note = "Phase 6 step 8, landed 2026-10-10: the whole unit (`crates/xedit-session/src/script_rtl/system.rs`), 76 live registrations -- the `TObject`/`TInterfacedObject` methods, `Move` (upstream's own `NotImplemented`), `ParamCount`/`ParamStr`/`Randomize`/`Random` (the RTL's `$08088405` LCG), `UpCase`, the `Var*` helpers (`VarType` with the Delphi codes incl. the six custom-type codes the RTL allocates at startup, `VarAsType`, `VarArrayCreate`/`Of`/bounds, `VarFromDateTime`), `ord`, `Chr`, `Abs`, `Length`, `Copy` (the clamp of a zero index), `Round`/`Trunc` (banker's rounding through `xedit_core::delphi`), `Pos`, `Delete`/`Insert` (through the `var` write-back), the math functions (`Sin`/`Cos`/`Tan`/`ArcTan` through `nif_math`, the FPU port), `SetLength` (strings and interpreter arrays, resizing as upstream; an `array of string` raises `Array to array assignment` where upstream's raw reallocation faults, seen by parity #28's probe `a-04`), `High`/`Low` (with the upstream `High`-returns-the-low-bound copy-paste for a native variant array), `DeleteFromArray`/`InsertIntoArray`, and the twenty-four variant type constants (`varEmpty`..`varInt64` with the Delphi ordinals, `varArray` being the custom-type value). Eleven commented-out registrations are `excluded` in the ledger with their lines (`GetInterface`, the eight WideChar/OleStr, the three VarArrayLock/Unlock/Ref). What the port answers differently: `Move` raises (the value model has no raw memory), `ClassInfo` is the nil pointer and `InstanceSize` 0 (no RTTI), `RefCount` 0. The unit is tracked because `cargo xtask sync` scans the JVCL interpreter units `xejviScriptAdapter.pas` registers in its `Init` (`xEdit/JvI/xejviScriptAdapter.pas:356-371`) under `External/jvcl/jvcl/run/`; the submodule is outside the map's unit directories, so the sync reads the files by name (`crates/xtask/src/main.rs`: JVCL_UNITS)."
note = "Phase 6 step 8, landed 2026-10-10: the whole unit (`crates/xedit-session/src/script_rtl/system.rs`), 76 live registrations -- the `TObject`/`TInterfacedObject` methods, `Move` (upstream's own `NotImplemented`), `ParamCount`/`ParamStr`/`Randomize`/`Random` (the RTL's `$08088405` LCG), `UpCase`, the `Var*` helpers (`VarType` with the Delphi codes incl. the six custom-type codes the RTL allocates at startup, `VarAsType`, `VarArrayCreate`/`Of`/bounds, `VarFromDateTime`), `ord`, `Chr`, `Abs`, `Length`, `Copy` (the clamp of a zero index), `Round`/`Trunc` (banker's rounding through `xedit_core::delphi`, which gives the x64 integer indefinite for a NaN or an out-of-range value; the handlers keep the low 32 bits, so `Round(NaN)` is 0 -- parity #39), `Pos`, `Delete`/`Insert` (through the `var` write-back), the math functions (`Sin`/`Cos`/`Tan`/`ArcTan` through `nif_math`, the FPU port), `SetLength` (strings and interpreter arrays; the array write-back raises `Array to array assignment` as upstream's does), `High`/`Low` (with the upstream `High`-returns-the-low-bound copy-paste for a native variant array), `DeleteFromArray`/`InsertIntoArray`, and the twenty-four variant type constants (`varEmpty`..`varInt64` with the Delphi ordinals, `varArray` being the custom-type value). Eleven commented-out registrations are `excluded` in the ledger with their lines (`GetInterface`, the eight WideChar/OleStr, the three VarArrayLock/Unlock/Ref). What the port answers differently: `Move` raises (the value model has no raw memory), `ClassInfo` is the nil pointer and `InstanceSize` 0 (no RTTI), `RefCount` 0. The unit is tracked because `cargo xtask sync` scans the JVCL interpreter units `xejviScriptAdapter.pas` registers in its `Init` (`xEdit/JvI/xejviScriptAdapter.pas:356-371`) under `External/jvcl/jvcl/run/`; the submodule is outside the map's unit directories, so the sync reads the files by name (`crates/xtask/src/main.rs`: JVCL_UNITS)."

