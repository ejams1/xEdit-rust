status = "ported"
rust = "crates/xedit-session/src/script_rtl/classes.rs"
note = "Phase 6 step 8, landed 2026-10-10: the whole unit (`crates/xedit-session/src/script_rtl/classes.rs`), 191 live registrations -- the eighteen constants (`TAlignment`, `TShiftState`, `dup*`, `cs*`), the classes (`TList`, `TPersistent`, `TCollectionItem`, `TCollection`, `TStrings`, `TStringList`, `TStream`, `TFileStream`, `TMemoryStream`, `TStringStream`, `TComponent` with the Delphi parent chains, so `TStringList.Create` is a `TStrings`) and their members. The list objects are the ones phases 5 to 7 share (`xedit_script::lists::ScriptList`, `xedit_script::strings::ScriptStringList`, extended in this step with the member set the Classes unit needs), so a `TList` or `TStringList` a host function fills is the same value the script reads, and `TwbFastStringList` is the resource adapter's subclass of the same class. Items and lines keep *values* where upstream stores raw pointers. Parity #30 (2026-10-15) added the three stream classes the misc family registers -- `TBinaryReader`, `TBinaryWriter` and `TBytesStream`, with `StreamState::is_memory_stream` telling a `TMemoryStream` from a `TBytesStream` for the JSON writer's truncating flush -- and `TFileStream.Create` now makes a file for `fmCreate` (`$FF00`). `AddHandler(TNotifyEvent/THelpEvent)` registers the two event types. `TList.Sort`, `TStrings.StringsAdapter` (write), the `TStream` component-streaming members and `TComponent.ComponentState`/`ComponentStyle` raise upstream's own `NotImplemented` texts. The unit is tracked because `cargo xtask sync` scans the JVCL interpreter units `xejviScriptAdapter.pas` registers in its `Init` (`xEdit/JvI/xejviScriptAdapter.pas:356-371`) under `External/jvcl/jvcl/run/`; the submodule is outside the map's unit directories, so the sync reads the files by name (`crates/xtask/src/main.rs`: JVCL_UNITS)."

