[units."Core/wbImplementation.pas"]
status = "pending"
rust = "crates/xedit-core/src/implementation"
note = "The structure scan of a file, the records, subrecords, values, unions, the record header and the contained-in element are ported for reading. The save path (implementation/write.rs: the modified states, PrepareSave with the header edits, WriteToStream, the CRC32; the storage merge of the elements builds the data in their memory order, `implementation/edit.rs`'s port of `TwbContainer.UpdateMemoryOrder` and `MergeStorageInternal`, so a container the view sorted is written back in the order its data had) and the editing path (implementation/edit.rs: the storage of a changed element, RequestStorageChange, UpdateStorageFromElements, the update counter and its notifications, SetEditValue, SetNativeValue, SetToDefault, the elements made from their definitions, Add of a record member, Remove, the required members added on init) are ported. The master management (implementation/masters.rs: AddMasters, AddMastersIfMissing, AddMasterIfMissing, SortMasters, CleanMasters, HasMaster, GetIsEditable, the MastersUpdated and FindUsedMasters chains through files, groups, records, subrecords, unions and values, SortRecords again after a change) is ported, without the two views of the masters during an update (fsMastersUpdating, eMastersGeneration) and the INFO sort of a topic group after it. The FormID path (implementation/form_ids.rs: SetLoadOrderFormID, UpdateInteriorCellGroup, SetGroupLabel, GetIsInjected, the registration part of AddMainRecord with the light, medium and update checks, flRemoveKeysFromIndices), the module flags of TwbFile (implementation/file_flags.rs: GetIsNotPlugin, GetIs and SetIs of the ESM, light, medium, update, blueprint and localized flags) and BuildRef and CompareExchangeFormID of the elements (implementation/refs.rs) are ported. The reference index (phase 4 step 1): TwbMainRecord.BuildRef, DoBuildRef with ProcessRef (also for the complex FileIDs), UpdateRefs from ElementChanged and SetParentModified, AddReferencedBy, RemoveReferencedBy, FindReferencedBy, SortReferencedBy and CompareReferencedBy, GetReferencedBy and GetReferencedByCount, mrReferences with the MastersUpdated fix-up (the elements of a record are visited only when one of its references changes), the referenced-by lists handed over by YouAreTheMaster, YouGotAMaster, SetLoadOrderFormID and Remove (DoBuildRef(True)), the BuildRef of a record that TwbGroupRecord.Add or a copy makes, TwbFile.BuildRef and BuildOrLoadRef with the reference cache file (implementation/refcache.rs: SaveRefsToStream, LoadRefsFromStream, the cache file name with wbCRC32App, the thresholds) are ported; the references of the files to build are collected on the worker threads record by record (not in upstream, which builds one file per thread). TwbDataContainer.SetDataSize runs the init again inside the init of the element (an AfterLoad that resizes it). Not ported: BuildReachable and Reached, the names, base record and grid cell that LoadRefsFromStream gives a record besides its editor ID and full name, TwbGroupRecord.BuildRef (SetChildGroup). The add, remove and copy path (implementation/assign.rs: Assign and CanAssign of TwbElement and TwbContainer with IsElementEditable, IsElementRemovable, GetIsRemovable, ContainsReflection and ContainsUnmappedFormID, and the overrides of the subrecords, values and main records next to them; implementation/add.rs: TwbMainRecord.Create with a signature, the TwbGroupRecord.Create overloads, Add of the file, the groups and the main records with their child groups, SetEditorID, SetGridCell, SetPosition, TwbMainRecord.Remove with RemoveMainRecord (and `TwbContainer.RemoveElement`: the removed element leaves its container and the elements below the position take their places as memory orders, `implementation/edit.rs`), YouGotAMaster and YouAreTheMaster; implementation/copy.rs: CopyInto, wbCopyElementToFile, wbCopyElementToRecord, AddIfMissing of the file, the groups and the main records, ReportRequiredMasters, AddRequiredMasters; implementation/new_form_id.rs: NewFormID, GetNextObjectID, SetNextObjectID, GetHighObjectID) is ported, including the parity batch #22 (implementation/template.rs: GetAssignTemplates, TwbTemplateElement; implementation/moving.rs: CanMoveUp, CanMoveDown, MoveUp, MoveDown, InsertElement; implementation/copy.rs: wbCanOverwrite with TwbCanOverwriteAction and the callback, MakePartialForm, the aligned creates of the subrecords and values), without UpdateCellChildGroup and the GroupToSkip and RecordToSkip lists. The scan of TwbFile.Scan and TwbGroupRecord.ScanData runs the large groups on worker threads (implementation/scan.rs) and replays AddMainRecord in file order; csInit/csInitializing of DoInit wait for another thread's init (threads.rs, not in upstream, which builds on one thread). Phase 4 step 2 (the queries of the view): IwbSortableContainer (GetSorted and GetAlignable of TwbSubRecord, TwbSubRecordArray, TwbArray and TwbValue), GetDisplaySortKey, GetConflictPriorityCanChange, ContentIsAllZero, esOptionalAndMissing and the elements of a container in the order DoInit(True) leaves them (implementation/sortable.rs), TwbFlag and the wbFlagsAsArray part of ValueDoInit (implementation/flag.rs; the flags are built on demand for the view and the conflict detection, not held in the element lists), the translate mode rule of GetConflictPriority, the sort of the responses of a topic (implementation/info_sort.rs: TwbGroupRecord.Sort of a group of type 7 under wbSortINFO with ProcessDIAL, DoInsertRecord, MasterRecordsFromMasterFilesAndSelf, the TwbMainRecordEntry list, the INOM and INOA lists, and the sort at the end of TwbMainRecord.Init; not the PNAM of wbFillPNAM nor gsSortPostponed), the wbComplexFileFileID branches of FileFileIDtoLoadOrderFileID, LoadOrderFileIDtoFileFileID, GetFileFileID, IsNewRecord, GetMasterForFileID, GetMasterRecordByFormID and DoGetFixedFormID (the light and medium masters of Starfield count their own slots), and the MemoryOrder that AddElement gives an element. Pending: the sort of a sorted array value inside a subrecord on load (srsSorted, arrSorted; the view sorts its own copy) and the sort of an array after CompareExchangeFormID, flags in the element lists of their values, csSortedBySortOrder and the SortOrder the view gives aligned entries (the view keeps its own), GetRawDataAsString for wbCompareRawData, CollapseStorage, and the identity FormID of a TES3 record (the string tables of a localized file are written since phase 4 step 7, see Core/wbLocalization.pas). Phase 3 step 6 (from the oracle's own saves): the sort of a sorted subrecord array (arcSorted and arcSortInvalid of TwbSubRecordArray, CompareSortKeys), the sort keys of TwbContainer, TwbSubRecord and TwbSubRecordStruct, GetGroupLabel, the search of GetChildGroup (with the quest children group), ChildrenOf of an exterior block, SetIsPersistent and SetIsVisibleWhenDistant with CheckChildOfCell and UpdateCellChildGroup, fsIsOfficial of the official modules (Starfield does not edit them), GetShortNameInternal under wbDisplayShorterNames, and the record count without a skipped duplicate record. Phase 4 step 5: TwbMainRecord.SetIsDeleted(False) with the move of TwbContainedInElement.DoAfterSet for a cell owner, SetIsInitiallyDisabled, GetPosition (implementation/undelete.rs); GetInjectionSourceFiles, GetReferencesInjected and RemoveInjected (implementation/injected.rs); TwbGroupRecord.Remove; the wbFillPNAM branches of TwbMainRecord.Init and ProcessDIAL; DoInit before SetModified in MarkModifiedRecursive; the write of a modified record whose storage is valid from its loaded data (dcfStorageInvalid of a main record); srsSorted and srsSortInvalid of TwbSubRecord and arrSorted and arrSortInvalid of TwbArray with DoInit(True) on an element read by index and on write; MastersUpdated sorts no array and ends with the record data merged from its elements (CollapseStorage, approximated); ReverseElements without SetModified; the quick init (mrsQuickInit) creates no record header, stops at the first subrecord past QuickInitLimit or runs the whole tail of Init when the record has none, and releases its elements (DoReset(True)); an invalidated storage collapses at the start of the next Init (GetDataBasePtr's UpdateStorageFromElements, CollapseStorage(nil, True)) into the record's own data (parity #23). UpdateKeys with BuildIndexKeys, ActivateIndexKeys, DeactivateIndexKeys and TwbFile.UpdateIndexKeys with flUpdateChangedKeysInIndices are ported (parity #23); UpdateRefs runs while the record's own init changes it. Pending: TwbMainRecord.Delete, the move of a cell between worldspaces in DoAfterSet. Phase 4 step 3 (implementation/check.rs and the element files): GetCheck of TwbMainRecord (the update and light or medium module checks, HITME, the members of a deleted record and of a partial form, the missing required members, the ToStr callback with ctCheck), TwbSubRecord, TwbSubRecordArray, TwbSubRecordStruct and TwbValueBase (TwbElement keeps the empty default for the file, groups, flags and terminators), TwbMainRecord.GetPath (the signature), TwbValueBase.GetName without a space before the suffix of an unnamed value, the AfterLoad of the resolved definition at the end of TwbValue.Init (ValueDoInit; values of other kinds had it), the flags of wbFlagsAsArray found by name in a path (ElementByPath, ElementExists), the Contained subrecords line of DBGSUBREC (which the 4.1.5q release is built with) after Errors were found in, SetReferencesInjected and the cached GetReferencesInjected from mrReferences (mrsReferencesInjectedChecked, answered once the references are built, set by YouAreTheMaster, cleared by RemoveInjected), and DoInit(True) of the sorted arrays clears arcSortInvalid, arrSortInvalid and srsSortInvalid only once the elements are sorted (a reader on another thread saw them unsorted). Phase 4 step 8: wbNewFile and TwbFile.CreateNew(aFileName, aLoadOrder, aIsLight, aIsMedium) (implementation/new_file.rs: the header from its definition with the HEDR version and next object ID, the slot, the Starfield master; not flModule nor the template overload), TwbMainRecord.Create with the file as its container (the file header), LoadOrderFileIDtoFileFileID taking the last of two masters with the same slot, and TwbSubRecord.GetDisplayName reading srValueDef without initialising the subrecord."

[units."Core/wbInterface.pas"]
status = "pending"
rust = "crates/xedit-core/src/interface"
note = "The definition classes are ported by hand, with FromEditValue, FromNativeValue and SetToDefault for every value definition and formater. MastersUpdated and FindUsedMasters of the definitions and formaters (TwbIntegerDef, TwbFormIDDefFormater, TwbIntegerDefFormaterUnion, TwbStringMgefCodeDef), FixupFormID and TwbSlotCounts.Create are ported (form_id.rs). The builder functions are generated into builders.rs by cargo xtask port-defs emit, with their constructors in constructors.rs. CompareExchangeFormID is ported for TwbIntegerDef, TwbFormIDDefFormater and TwbIntegerDefFormaterUnion, and the flag setters of TwbMainRecordStructFlags with the mutual exclusion of the light, medium and update flags. Assign and CanAssign of every definition and formater are ported (def.rs and the files of the classes). The threadvars _InternalEditCount and _BlockInternalEdit are thread locals (globals.rs). Pending: SetLinksTo, PrepareSave of the definitions, and the rest of the unit."

[units."Core/wbLOD.pas"]
