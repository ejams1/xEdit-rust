[units."External/jvcl/jvcl/run/JvInterpreter.pas"]
status = "pending"
rust = "crates/xedit-script/src/interpreter.rs"
note = "Phase 6 steps 2 and 3: the parser front end is ported, as an AST builder instead of the interpreter's parse-and-execute pass (crates/xedit-script/src/interpreter.rs: InterpretUnit and the Interpret*/Expression/ReadArgs routines, ReadFunctionHeader, ParseDataType, InterpretVar/InterpretConst/InterpretType -- the last extended for type aliases and enums, which only the declaration-only xEditAPI.pas of the corpus needs), and the runtime over it landed in step 3: the value model (crates/xedit-script/src/values.rs: the extended variant types of :1417-1445, JvInterpreterVarAsType/Var2Type, JvInterpreterVarCopy/Assignment, V2O ... P2R, S2V/V2S, TypeName2VarTyp, the array record and the variant operators of Expression), the adapter registration model and the GetValue/SetValue/GetElement/SetElement dispatch with the sorted identifier lists (crates/xedit-script/src/adapter.rs: AddFunction/AddConst/AddClass/AddGet/AddSet/AddIGet/AddISet/AddIDGet/AddIDSet/AddRec/AddRecGet/AddRecSet/AddHandler/AddEvent/AddExtUnit/AddSrcUnit/AddSrcFun/AddSrcVar/AddExtFun, CheckArgs and FindFunDesc), and the evaluator (crates/xedit-script/src/eval.rs: Compile/ReadUnit/InterpretUses over parse_compile with ExecFunction's body re-parse through interpreter::parse_body, the var/const parameter modes with the UpdateVarParams write-back, CallFunction/CallFunctionEx and Run's main convention, InterpretRaise/exceptions with UpdateExceptionPos and GetLastErrorLocation, the OnStatement hook, and the for/case 64-bit integer acceptance of Expression2). The unit stays pending: the RTTI surface (GetValueRTTI, method-property and event assignment) is the VCL form shim's (step 9), the host compile/run loop of xeScriptHost/xeMainForm is step 4, AddIntfGet and the OLE automation branch are not ported (no varUnknown without COM; OLE is compiled out of the xEdit build), and an external DLL routine registers but calls through Adapter::external_call, the host's CallDll seam. The tokenizer of this front end is the separate JvInterpreterParser.pas entry. The parity batch #28 (2026-10-15, PR #49) then closed the known language-level differences against the oracle: Delphi's variant arithmetic and comparisons and the `Expression1` cast error (`'x' + 5` and `'x' + True` are `Type mismatch`), the typed-slot conversion error classes and texts, array resizing/assignment and fixed-array bounds, record-variable vs type-name method resolution, the routine terminators and `FunctionIsEmpty` spellings, and the `cJvInterpreterStackMax` expression-stack overflow modelled push for push over the AST (`crates/xedit-script/src/values.rs`, `interpreter.rs`, `eval.rs`), witnessed by the new probe phase of `cargo xtask parity script` (`crates/xtask/oracle/scripts/probes/`, 880 probes, 880 of 880 equal, the 32 faults, hangs and documented divergences accepted in `probes.json` with reasons)."

