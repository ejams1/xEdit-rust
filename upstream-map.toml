[units."xEdit/JvI/xejviScriptAdapter.pas"]
status = "ported"
rust = "crates/xedit-session/src/script_adapter.rs"
note = "Phase 6 (scripting), step 7 (landed 2026-10-10): all 132 ledger entries are covered by script.run. crates/xedit-session/src/script_adapter.rs registers the 14 `gm*` (the ordinals of `TwbGameMode`), the 14 `es*`, the 17 `dt*`, the 6 `cs*`, the 5 `res*` and the 30 `at*` constants (the ordinals of the upstream enumerations, `esDeciding` carrying `Ord(esResolving)` as upstream), the wbInterface external unit, the TwbVector and TwbGridCell records and their constructors, and the Dummy unit's functions: Assigned, ObjectToElement, FullPathToFilename (wbHelpers), EnableSkyrimSaveFormat (the wbTestWrite/wbForceNewHeader globals), GetRecordDefNames (the loaded game's record definitions), wbFilterStrings, wbRemoveDuplicateStrings (its TStringList.Find runs the binary search whatever Sorted says) and wbVersionNumber (`TwbVersion.ToCardinal` of 4.1.5q = $4010510). The 33 `et*`/`ca*`/`ct*` constants stay with step 4's run loop. Owed: `TwbVector`'s fields are doubles in the port (no `varSingle`), `ObjectToElement` leaves the result unassigned for anything that is not an element (upstream's cast of a foreign object is undefined)."

