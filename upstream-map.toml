[units."BSArchPro.dpr"]
status = "pending"

[units."Core/MSHeap.pas"]
status = "not-ported"
note = "Delphi memory manager override; Rust uses its own allocator."

[units."Core/wbBSA.pas"]
status = "ported"
rust = "crates/xedit-core/src/container_handler.rs"
note = "The container handler, the one resource handler of the process (the string tables of localized plugins, the script functions of xejviScriptAdapterResource and the LoadFromResource of the data formats, the asset lookups of LOD and of the Starfield definitions, the hash names): AddFolder (a folder named with its trailing separator), AddBSA and AddBA2 (the version a BA2 reports), ContainerExists, ContainerList, OpenResource, OpenResourceData, the resource listings (ContainerResourceList, ContainerResourceDict, ResourceExists, ResourceCount, ResourceCopy), EnsureCache and the file and folder hash tables (BuildCache, ResolveFileHash, ResolveFolderHash, wired into wbFileHashCallback and wbFolderHashCallback behind wbLoaderDone, which every session sets after its load as WMUserLoaderDone does). BuildCache walks the names in the bucket order of its TDictionary (crates/xedit-core/src/delphi_dictionary.rs: 2^21 buckets for Create(1000000), FNV-1a of the UTF-16 code units, both measured on the oracle by parity resources fnv-hashes), so of two names of one hash the oracle's wins; it reads <game>.HashSeed.txt next to the program and writes the seeds it added as .txt2. The unit has no texture helpers in this tag."

[units."Core/wbBSArchive.pas"]
status = "ported"
rust = "crates/xedit-io/src/archive"
note = "TwbAsset, TwbBSArchive (reading and writing every BSA, Morrowind and general BA2 version, the DX10 texture archives included: the DDS branches of Pack and Unpack and of TwbSplitPacker.LoadFile are archive/texture.rs; listing, Info and Warnings), TwbSplitPacker and TwbMultiSourcePacker (the steps of Process in upstream's single-thread order with the reading and compressing on all CPUs) are ported; the output equals BSArch.exe -mt:no for every thread count (cargo xtask parity bsarch, texture archives included). Not ported: the stream-to-stream overloads of wbCompression have no caller. DEVIATION: a texture whose data ends before its last mipmap is cut where the data ends in the route without a packer too (upstream reads past the buffer there)."

[units."Core/wbBetterStringList.pas"]
status = "pending"

[units."Core/wbCommandLine.pas"]
status = "ported"
rust = "crates/xedit-core/src/command_line.rs"
note = "The four overloads of wbFindCmdLineParam and the SwitchChars of System.SysUtils, with the 1-based indexes of Delphi's ParamStr. has_cmd_line_switch is FindCmdLineSwitch as xeInit.pas reads a tool mode (the switch alone or with a value)."

[units."Core/wbCompression.pas"]
status = "ported"
rust = "crates/xedit-io/src/compression.rs"
note = "Decompression and compression of every type: zlib (libdeflate level 12 up to 8 MiB, zlib's compress2 level 9 beyond), LZ4 (LZ4_compress_HC level 12) and LZ4F (LZ4F_compressFrame, independent 4 MB blocks), from the C libraries upstream links (lz4 1.10 gives the bytes of the oracle), and the stream overloads (compress_to, compress_stream with the buffered zlib of ZCompressStream and LZ4FCompressStream, decompress_stream with TLZ4.Stream_Decode), which have no caller in 4.1.5q and are checked by unit tests against the buffer routes. UPSTREAM-QUIRK: the buffered zlib route casts level 9 to TZCompressionLevel, beyond that enumeration; the port compresses at 9."

[units."Core/wbDDS.pas"]
status = "ported"
rust = "crates/xedit-io/src/dds.rs"
note = "TwbDDS (IsDDS, IsXBOX, IsCubeMap, HasAlpha, IsCompressed, HeaderDX10, HeaderXBOX, GetHeaderSize, GetMipSize, GetTileMode, GetDXGIFormatName, GetDXGI, GetD3DFMT, GetD3DFMTFormatName, SetUpHeader, GetBitsPerPixel, ConvertR8G8B8toB8G8R8X8) with the TDXGI and TD3DFORMAT numbers, the header records as DdsHeader, DdsHeaderDx10 and DdsHeaderXbox read from and written to byte slices, and the format sets. The conversion of 24 bit pixels runs on SSSE3 or AVX2 (simd.rs) with a scalar version that gives the same bytes; the half-float arrays of xedit-core/src/half_float.rs are the port's addition (F16C, scalar fallback, the same bits for all 2^32 singles)."

[units."Core/wbDataFormat.pas"]
status = "ported"
rust = "crates/xedit-assets/src/data_format.rs"
note = "The element tree is an arena (Tree, El); exceptions are DfError. JSON as JsonDataObjects writes it in json.rs, the Variant semantics in variant.rs. `dfStrToFloat` maps NaN/Inf/Max/Min/-0.0/empty as upstream and parses with `xedit_core::delphi::str_to_float` (the RTL's own `Val`, fitted at full precision); `dfCalcHash` lowers ANSI bytes as `HashName` does (parity #39 probed every byte; the ASCII half matches, the non-ASCII table is owed -- see docs/PLAN.md)."

